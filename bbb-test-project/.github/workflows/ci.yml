name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test, Lint, and Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies & run unit & integration tests
        run: |
          cd server
          npm ci
          npm test

      - name: Lint & Syntax verification
        run: |
          cd server
          node --check src/index.js
          node --check src/routes/meetings.js
          node --check src/bbb.js

      - name: Install client dependencies & verify client build
        run: |
          cd client
          npm ci
          npm run build

      - name: Verify Docker Compose Build
        run: |
          docker compose build
